[package]
name = "musiccraft-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "MusicCraft's library for the phone apps: one call, JSON in and JSON out"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# Not the workspace's lints: those forbid `unsafe`, and the two modules that the phones call
# through (`android`, `c`) need it to be named from C and Java. Everything else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"

[dependencies]
musiccraft-library.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile.workspace = true
