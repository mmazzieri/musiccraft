name: Mobile

# Builds the phone apps: the Android app with its library for two processors, and the iOS app for
# the simulator, unsigned. The Android build is kept as an artifact, to install for trying.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "crates/ffi/**"
      - "crates/library/**"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "crates/ffi/**"
      - "crates/library/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the app
        working-directory: mobile/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: musiccraft-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the app for the simulator
        working-directory: mobile/ios
        run: |
          xcodegen generate
          xcodebuild -project MusicCraft.xcodeproj -scheme MusicCraft \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build
