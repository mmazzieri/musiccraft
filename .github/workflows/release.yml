name: Release

# A tag vX.Y.Z builds every package and opens a draft GitHub release with them and
# SHA256SUMS.txt; the release is published by hand. A pull request that touches the
# packaging builds the same packages without releasing anything, so they are tested
# before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "assets/app-icon/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: glibc 2.35, so the binaries run on newer distros.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nfpm and rpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm rpm libasound2-dev
      - run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          set -eux
          ls -l dist/release
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/musiccraft|applications/'
          rpm -qip dist/release/*.rpm
          tar -tzf dist/release/*.tar.gz | grep -E 'bin/musiccraft$'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import the signing certificate (skipped without secrets)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      APP_NAME: MusicCraft
      SIGN: ${{ github.event_name != 'pull_request' && secrets.CERTUM_OTPAUTH != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and check the programs
        run: pwsh packaging/windows/package.ps1 -BuildOnly
      # Windows signing: Certum Open Source certificate in the cloud (SimplySign), signed in with the
      # account's TOTP. Runs only when the secrets are set, and never for pull requests.
      - name: Sign in to SimplySign (skipped without the signing secrets)
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign@4d4b0a2902185764953a35ccf754f31e7179cbfb # v1, MIT
        with:
          email: ${{ secrets.CERTUM_EMAIL }}
          otpauth: ${{ secrets.CERTUM_OTPAUTH }}
          thumbprint: ${{ vars.CERTUM_THUMBPRINT }}
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign/sign@4d4b0a2902185764953a35ccf754f31e7179cbfb
        with:
          root: target/x86_64-pc-windows-msvc/release
          files: |
            musiccraft.exe
            musiccraft-cli.exe
          description: ${{ env.APP_NAME }}
          description-url: https://github.com/${{ github.repository }}
      - name: Package
        run: pwsh packaging/windows/package.ps1 -SkipBuild
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: TIANLI0/codesign/sign@4d4b0a2902185764953a35ccf754f31e7179cbfb
        with:
          root: dist/release
          files: '*.msi'
          description: ${{ env.APP_NAME }}
          description-url: https://github.com/${{ github.repository }}
      - name: Sign out of SimplySign
        if: always() && env.SIGN == 'true'
        uses: TIANLI0/codesign/logout@4d4b0a2902185764953a35ccf754f31e7179cbfb
      - name: Check the MSI installs and removes cleanly (per user)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/release/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', 'ALLUSERS=2', 'MSIINSTALLPERUSER=1', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MusicCraft\musiccraft.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "MusicCraft ${GITHUB_REF_NAME#v}" --generate-notes
