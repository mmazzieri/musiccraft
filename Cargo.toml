[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mmazzieri/musiccraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"

[workspace.dependencies]
musiccraft-library = { path = "crates/library" }
musiccraft-player = { path = "crates/player" }
musiccraft-services = { path = "crates/services" }
musiccraft-engine = { path = "crates/engine" }
musiccraft-ui = { path = "crates/ui" }
# The shared Craft libraries, all at one revision.
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a" }
craft-plist = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a" }
craft-csv = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "249a41bd9306a1b34330ac94e596a1a8b881378a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
lofty = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
keyring = "4"
url = "2"
dirs = "6"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui_kittest = { version = "0.37", features = ["eframe"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[package]
name = "musiccraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "MusicCraft: a music library and player for your files, servers, radio and subscriptions"

[lints]
workspace = true

[build-dependencies]
# The icon inside the Windows executable; build.rs uses it only when the target is Windows.
winresource = { version = "0.1.34", default-features = false }

[dependencies]
musiccraft-ui.workspace = true
eframe.workspace = true
egui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
