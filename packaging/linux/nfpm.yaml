# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} and exports VERSION, NFPM_ARCH and GLIBC_FLOOR.
# Adapted from storytold/craft-launcher (packaging/linux/nfpm.yaml, MIT OR Apache-2.0).
name: musiccraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: sound
priority: optional
maintainer: Mauro Mazzieri <https://github.com/mmazzieri>
vendor: Mauro Mazzieri
homepage: https://github.com/mmazzieri/musiccraft
license: MIT OR Apache-2.0
description: |-
  Music library and player for your files, servers, radio and subscriptions.
  MusicCraft keeps music and library together in a folder you choose, which
  any folder-sync service can share between computers.

# The binary links glibc, libgcc_s and the system's ALSA library directly; windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are listed by hand.
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_FLOOR})
      - libgcc-s1
      - libasound2t64 | libasound2
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcursor1
      - libxi6
      - libvulkan1 | libegl1
    recommends:
      - mesa-vulkan-drivers
      - libegl-mesa0
      - xdg-desktop-portal
  rpm:
    depends:
      - glibc >= ${GLIBC_FLOOR}
      - libasound.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/musiccraft
    dst: /usr/bin/musiccraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/musiccraft-cli
    dst: /usr/bin/musiccraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
